<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Група 101 - Студенти</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }
        .student {
            background: rgba(255, 255, 255, 0.15);
            margin: 15px 0;
            padding: 20px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .student:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
        }
        .number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Група 101 — Студенти</h1>
        
        <div class="student">
            <span class="number">01.</span> Віскрівець Дмитро Олександрович
        </div>
         <div class="student">
            <span class="number">02.</span> Ткач Євгеній Вячеславович
        </div>
        
    </div>
</body>
</html>
